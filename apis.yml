name: Terapify
description: Terapify is an online therapy platform for the Spanish-speaking market, connecting individuals
  in Mexico and Latin America with certified psychologists for private, secure video-call sessions. Founded
  in 2019 and backed by 500 Global and Y Combinator, the platform matches patients to therapists via a
  therapeutic-affinity test, offers individual and couples therapy, parent orientation, and workplace
  mental-health programs for companies, plus mindfulness, yoga, and breathing resources. It operates as
  a consumer web and mobile (iOS/Android) product and publishes no public developer API surface.
